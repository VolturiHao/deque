plugins { id 'com.android.application' }
def signingFile = rootProject.file('signing.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
android { namespace 'cn.deque'; compileSdk 33
 defaultConfig { applicationId 'cn.deque'; minSdk 23; targetSdk 33; versionCode 21; versionName '2.3.3' }
 signingConfigs { release { if (signingFile.exists()) { storeFile rootProject.file(signing['storeFile']); storePassword signing['storePassword']; keyAlias signing['keyAlias']; keyPassword signing['keyPassword'] } } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false; debuggable false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation "com.google.android.material:material:1.9.0"; implementation "androidx.recyclerview:recyclerview:1.3.0" }

